name: Daily Dial Reset (00:00 IST)

on:
  # The Vercel cron in backend/vercel.json handles the daily schedule (30 18 * * *).
  # This GitHub Actions schedule has been disabled to avoid double-firing the reset
  # endpoint at midnight IST. Keep workflow_dispatch so you can still trigger manually.
  workflow_dispatch: # Manual trigger only
jobs:
  reset-daily-dials:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily reset endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/cron/reset-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ne 200 ]; then
            echo "ERROR: Reset endpoint returned non-200 status: $RESPONSE"
            exit 1
          fi

          echo "Daily reset triggered successfully."
